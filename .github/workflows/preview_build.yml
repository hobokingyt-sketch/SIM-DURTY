name: Windows Preview

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SIM_DURTY_BUILD_CHANNEL: preview
  SIM_DURTY_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SIM_DURTY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SIM_DURTY_BUILD_REF: ${{ github.head_ref || github.ref_name }}
  SIM_DURTY_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
  SIM_DURTY_BUILD_RUN_ID: ${{ github.run_id }}
  SIM_DURTY_BUILD_PR: ${{ github.event.pull_request.number || 'manual' }}

jobs:
  export:
    name: Validate Source and Export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      engine_version: ${{ steps.engine.outputs.version }}
    steps:
      - name: Checkout exact preview source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Godot and templates outside project
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SIM_DURTY_BUILD_SHA"
          version="$(tr -d '\r\n' < .godot-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          engine_dir="$RUNNER_TEMP/sim-durty-toolchain"
          mkdir -p "$engine_dir"
          curl --fail --location --retry 3 --output "$engine_dir/editor.zip" \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${version}"
          unzip -q "$engine_dir/editor.zip" -d "$engine_dir"
          mv "$engine_dir/Godot_v${version}-stable_linux.x86_64" "$engine_dir/godot"
          chmod +x "$engine_dir/godot"
          actual="$("$engine_dir/godot" --version)"
          [[ "$actual" == "$version.stable"* ]]
          echo "$engine_dir" >> "$GITHUB_PATH"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          curl --fail --location --retry 3 --output "$engine_dir/templates.tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/Godot_v${version}-stable_export_templates.tpz"
          unzip -q "$engine_dir/templates.tpz" -d "$engine_dir/template_unpack"
          template_dir="$HOME/.local/share/godot/export_templates/${version}.stable"
          mkdir -p "$template_dir"
          cp -a "$engine_dir/template_unpack/templates/." "$template_dir/"
          test -s "$template_dir/windows_debug_x86_64.exe"

      - name: Import and validate the exact source being exported
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sim-durty-export-logs"
          check() {
            name="$1"; shift
            log="$RUNNER_TEMP/sim-durty-export-logs/$name.log"
            godot --headless --path . "$@" 2>&1 | tee "$log"
            if grep -Eq '^[[:space:]]*(SCRIPT ERROR:|ERROR:|FATAL:|Parse Error:)' "$log"; then
              echo "Engine error detected in $name" >&2; exit 1
            fi
          }
          check import --import
          check architecture --script tools/validation/architecture_guard.gd
          check tests --script tests/runner.gd
          grep -Eq '^\[architecture\] PASS\r?$' "$RUNNER_TEMP/sim-durty-export-logs/architecture.log"
          grep -Eq '^\[tests\] PASS\r?$' "$RUNNER_TEMP/sim-durty-export-logs/tests.log"
          export SIM_DURTY_BUILD_TIME_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          check metadata --script tools/build/write_build_manifest.gd
          check verify --script tools/build/verify_build_manifest.gd
          mkdir -p build/windows
          check export --export-debug 'Windows Preview' build/windows/SIM-DURTY.exe
          test -s build/windows/SIM-DURTY.exe
          test -s build/windows/SIM-DURTY.pck
          cp game/core/build/generated/build_manifest.json build/windows/BUILD-METADATA.json
          cp tools/build/preview_readme.txt build/windows/START_HERE.txt

      - name: Package exact candidate and calculate checksum
        id: package
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="SIM-DURTY-preview-${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}-${SIM_DURTY_BUILD_SHA:0:12}"
          mkdir -p build/artifacts
          (cd build/windows && zip -q -r "../artifacts/${artifact_name}.zip" .)
          checksum="$(sha256sum "build/artifacts/${artifact_name}.zip" | cut -d ' ' -f 1)"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$checksum" >> "$GITHUB_OUTPUT"

      - name: Transfer candidate to Windows validator (not a playtest build)
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ steps.package.outputs.artifact_name }}
          path: build/artifacts/*.zip
          if-no-files-found: error
          retention-days: 1

      - name: Preserve export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-logs-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-durty-export-logs/
          if-no-files-found: warn
          retention-days: 14

  windows-verify:
    name: Windows Packaged Boot
    needs: export
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      EXPECTED_ARCHIVE_HASH: ${{ needs.export.outputs.archive_sha256 }}
      EXPECTED_GODOT_VERSION: ${{ needs.export.outputs.engine_version }}
    steps:
      - name: Checkout validation tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download exact candidate
        uses: actions/download-artifact@v5
        with:
          name: candidate-${{ needs.export.outputs.artifact_name }}
          path: ${{ runner.temp }}/sim-durty-incoming

      - name: Test the validator, then boot the packaged EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/build/verify_windows_preview.ps1 -SelfTest
          $archives = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'sim-durty-incoming') -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one preview ZIP.' }
          ./tools/build/verify_windows_preview.ps1 `
            -ArchivePath $archives[0].FullName `
            -ExpectedSha $env:SIM_DURTY_BUILD_SHA `
            -ExpectedArchiveHash $env:EXPECTED_ARCHIVE_HASH `
            -ExpectedGodotVersion $env:EXPECTED_GODOT_VERSION `
            -ReportDirectory (Join-Path $env:RUNNER_TEMP 'sim-durty-validation')
          "$($env:EXPECTED_ARCHIVE_HASH)  $($archives[0].Name)" | Set-Content ($archives[0].FullName + '.sha256') -Encoding ascii

      - name: Publish verified preview
        id: verified
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.export.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/sim-durty-incoming/*.zip
            ${{ runner.temp }}/sim-durty-incoming/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/sim-durty-validation/
          if-no-files-found: warn
          retention-days: 14

      - name: Write playtest handoff
        shell: pwsh
        env:
          VERIFIED_URL: ${{ steps.verified.outputs.artifact-url }}
        run: |
          "## Verified Windows preview" >> $env:GITHUB_STEP_SUMMARY
          "Source: $env:SIM_DURTY_BUILD_SHA" >> $env:GITHUB_STEP_SUMMARY
          "[Download preview]($env:VERIFIED_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Verified: ZIP checksum, native Windows headless startup, packaged build identity. Graphics and clipboard still need owner playtesting." >> $env:GITHUB_STEP_SUMMARY
