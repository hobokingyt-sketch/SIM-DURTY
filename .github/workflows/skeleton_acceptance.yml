name: Skeleton Acceptance

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skeleton-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: State, Persistence, Render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned engine and virtual display
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .godot-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          engine_dir="$RUNNER_TEMP/skeleton-engine"
          mkdir -p "$engine_dir"
          curl --fail --location --retry 3 --output "$engine_dir/editor.zip" \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${version}"
          unzip -q "$engine_dir/editor.zip" -d "$engine_dir"
          mv "$engine_dir/Godot_v${version}-stable_linux.x86_64" "$engine_dir/godot"
          chmod +x "$engine_dir/godot"
          echo "$engine_dir" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Test state, recovery, workspace and widget interaction
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/skeleton-acceptance"
          mkdir -p "$reports"
          git rev-parse HEAD > "$reports/source-sha.txt"
          git archive --format=tar.gz -o "$reports/tested-source.tar.gz" HEAD
          check() {
            name="$1"; shift
            timeout 90s "$@" 2>&1 | tee "$reports/$name.log"
            if grep -Eq '^[[:space:]]*(SCRIPT ERROR:|ERROR:|FATAL:|Parse Error:)' "$reports/$name.log"; then
              exit 1
            fi
          }
          check import godot --headless --path . --import
          check tests godot --headless --path . --script tests/runner.gd
          grep -q '^\[tests\] PASS' "$reports/tests.log"
          for mode in write read; do
            for probe in skeleton recovery workspace; do
              check "$probe-$mode" godot --headless --path . -- "--$probe-probe=$mode"
              grep -q "^\[$probe-probe\] PASS $mode" "$reports/$probe-$mode.log"
            done
            check "widgets-$mode" godot --headless --path . -- "--widget-probe=$mode"
            grep -q "^\[widget-probe\] PASS $mode" "$reports/widgets-$mode.log"
          done
          check os-verify godot --headless --path . -- --os-probe=verify
          grep -q '^\[os-probe\] PASS selection navigation command isolation' "$reports/os-verify.log"
          check app-verify godot --headless --path . -- --app-probe=verify
          grep -q '^\[app-probe\] PASS lifecycle navigation continuity' "$reports/app-verify.log"
          for size in 2560x1440 1600x900; do
            for mode in city operations tools; do
              export SIM_DURTY_CAPTURE_PATH="$reports/os-$mode-$size.png"
              check "render-$mode-$size" xvfb-run -a -s '-screen 0 3000x1800x24' \
                godot --path . --resolution "$size" --rendering-method gl_compatibility --audio-driver Dummy \
                -- --os-probe="$mode"
              test -s "$SIM_DURTY_CAPTURE_PATH"
            done
          done
          for case in '1280x800:capture' '1600x900:capture' '2560x1440:capture' '1600x900:capture-layout' '2560x1440:capture-layout' '1600x900:capture-collapsed' '1920x1080:capture-scaled'; do
            size="${case%%:*}"; mode="${case#*:}"
            export SIM_DURTY_CAPTURE_PATH="$reports/workspace-$mode-$size.png"
            check "workspace-$mode-$size" xvfb-run -a -s '-screen 0 3000x1800x24' \
              godot --path . --resolution "$size" --rendering-method gl_compatibility --audio-driver Dummy \
              -- --workspace-probe="$mode"
            test -s "$SIM_DURTY_CAPTURE_PATH"
          done
          for case in '1280x800:capture' '1600x900:capture' '2560x1440:capture' '1600x900:capture-preview' '1600x900:capture-invalid' '2560x1440:capture-major' '1600x900:capture-right'; do
            size="${case%%:*}"; mode="${case#*:}"
            export SIM_DURTY_CAPTURE_PATH="$reports/widgets-$mode-$size.png"
            check "widgets-$mode-$size" xvfb-run -a -s '-screen 0 3000x1800x24' \
              godot --path . --resolution "$size" --rendering-method gl_compatibility --audio-driver Dummy \
              -- "--widget-probe=$mode"
            test -s "$SIM_DURTY_CAPTURE_PATH"
          done
          for case in '1600x900:operations' '1600x900:record' '2560x1440:operations' '1280x800:record'; do
            size="${case%%:*}"; mode="${case#*:}"
            export SIM_DURTY_CAPTURE_PATH="$reports/apps-$mode-$size.png"
            check "apps-$mode-$size" xvfb-run -a -s '-screen 0 3000x1800x24' \
              godot --path . --resolution "$size" --rendering-method gl_compatibility --audio-driver Dummy \
              -- "--app-probe=$mode"
            test -s "$SIM_DURTY_CAPTURE_PATH"
          done

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skeleton-acceptance-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/skeleton-acceptance/
          if-no-files-found: warn
          retention-days: 14
